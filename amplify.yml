version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20
        - node -v
        - yarn -v
        - yarn install --frozen-lockfile
    build:
      commands:
        - yarn build
  artifacts:
    # Required for Next.js SSR / SSG on Amplify Hosting compute
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
      - .yarn/cache/**/*
